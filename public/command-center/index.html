<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020406">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BB Command">
  <meta name="description" content="Big Booda's private Command Center: every app, live status, alerts and operations in one place.">
  <title>BB Command Center</title>
  <link rel="manifest" href="bb-command-center.webmanifest">
  <script>
    /* The official Command Center lives inside Chill Pros HQ. The old address forwards there;
       inside HQ it uses Brae's HQ sign-in (no sign-in yet: go sign in, then come straight back). */
    (function () {
      var h = location.hostname;
      if (h === 'chill-bros.vercel.app' || h === 'www.chill-bros.vercel.app') { location.replace('https://chill-pros-hq.vercel.app/command-center/' + location.hash); return; }
      var hq = h === 'chill-pros-hq.vercel.app' || /[?&]hq=1(&|$)/.test(location.search);
      document.documentElement.dataset.hq = hq ? '1' : '';
      if (!hq) return;
      var l = document.querySelector('link[rel="manifest"]'); if (l) l.setAttribute('href', '/manifest-brae.json');
      var s = null; try { s = JSON.parse(localStorage.getItem('cphq') || 'null'); } catch (e) {}
      if (!s || s.name !== 'brae' || !s.token) { try { sessionStorage.setItem('cphq-next', 'cc'); } catch (e) {} location.replace('/brae'); }
    })();
  </script>
  <link rel="icon" href="cc/favicon-48.png" type="image/png" sizes="48x48">
  <link rel="apple-touch-icon" href="cc/icon-180.png" sizes="180x180">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="cc/mascot.jpg">
  <link rel="stylesheet" href="cc/cc.css">
</head>
<body data-fx="heavy">
  <!-- Neon light background + Chill Pros dice sign -->
  <div class="neon" aria-hidden="true">
    <div class="neon-blob b1"></div><div class="neon-blob b2"></div><div class="neon-blob b3"></div>
    <div class="neon-tube t1"></div><div class="neon-tube t2"></div><div class="neon-tube t3"></div><div class="neon-tube t4"></div>
    <img class="dice-sign ds-left" src="cc/dice.webp" alt="">
    <img class="dice-sign ds-right" src="cc/dice.webp" alt="">
    <div class="neon-floor"></div>
  </div>

  <main class="stage cc-page">
    <!-- top banner: BB Command Center title, like the reference crown banner -->
    <header class="cc-top">
      <img src="assets/bb-command-center-logo.svg" alt="" class="cc-brand-mark">
      <h1>BB COMMAND CENTER</h1>
    </header>

    <!-- three-column shell: projects | hero + money | watch + action cards -->
    <section class="cc-shell">
      <!-- left: every project, one click each -->
      <nav class="proj-list cc-side-panel" aria-label="Projects">
        <p class="proj-head">MY PROJECTS</p>
        <div class="proj-items" data-apps="list"></div>
      </nav>

      <!-- center: hero art + money -->
      <div class="cc-center">
        <section class="cc-hero" aria-label="Overview">
          <div class="cc-jewel" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <div class="cc-hero-art">
            <img class="cc-mascot" src="cc/mascot.jpg" alt="Chill Pros" width="420" height="560">
          </div>
          <p class="cc-kicker"><span data-wx="icon">☀️</span> <span data-wx="temp">--°F</span> · <span data-wx="cond">Loading</span> · San Antonio, TX</p>
        </section>

        <section class="ops" aria-label="Notifications, money and apps">
          <div class="ops-feed">
            <button type="button" class="ops-card" data-go="alerts"><span class="ops-tag">NOTIFICATIONS</span><ul data-feed="notifs"></ul></button>
            <button type="button" class="ops-card money" data-go="money"><span class="ops-tag" data-money="tag">MONEY TODAY</span><b data-money="total">$0</b><span data-money="line">Waiting on payments</span></button>
          </div>
          <div class="ops-big" data-apps="big"></div>
        </section>
      </div>

      <!-- right: live watch + quick-glance action cards -->
      <aside class="cc-side-panel cc-side-right">
        <div class="cc-watch-wrap">
          <svg class="watch" viewBox="-100 -100 200 200" aria-label="Live watch" role="img"></svg>
          <div class="cc-clock-text">
            <b data-clock="time">--:--:--</b>
            <span data-clock="date"></span>
          </div>
        </div>
        <div class="cc-action-grid">
          <button type="button" class="cc-action-card" style="--c:#19ff9c" data-go="gibam">
            <span class="cc-ic"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="19" cy="6" r="2" fill="#fff"/></svg></span>
            <b>Projects monitored</b><span class="cc-val" data-stat="apps">9</span>
          </button>
          <button type="button" class="cc-action-card" style="--c:#4d8dff" data-go="settings">
            <span class="cc-ic"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="#fff" stroke-width="1.8"/></svg></span>
            <b>Owner access</b>
          </button>
          <button type="button" class="cc-action-card" style="--c:#ff7a1a" data-go="decisions">
            <span class="cc-ic"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M9 3h6v3H9z" fill="#fff"/><path d="M8 12h8M8 16h5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></span>
            <b>Approvals</b><span class="cc-val orange" data-stat="approvals">0</span>
          </button>
          <button type="button" class="cc-action-card" style="--c:#ff2bd6" data-go="status">
            <span class="cc-ic"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.2 8.3-7 10-3.8-1.7-7-5-7-10V6z" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M9 12.3l2.2 2.2L15.5 10" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <b>System status</b>
          </button>
          <button type="button" class="cc-action-card" style="--c:#1fb6ff" data-go="alerts">
            <span class="cc-ic"><svg viewBox="0 0 24 24"><path d="M12 3a5 5 0 0 0-5 5v3.2c0 .8-.3 1.5-.8 2.1L5 15h14l-1.2-1.7c-.5-.6-.8-1.3-.8-2.1V8a5 5 0 0 0-5-5z" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0" fill="none" stroke="#fff" stroke-width="1.8"/></svg></span>
            <b>Notifications</b>
          </button>
          <button type="button" class="cc-action-card" style="--c:#ffb000" data-go="weather">
            <span class="cc-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="4.2" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M12 3v1.6M12 15.4V17M5 10h1.6M17.4 10H19M6.8 4.8l1.1 1.1M16.1 14.1l1.1 1.1M6.8 15.2l1.1-1.1M16.1 5.9l1.1-1.1" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></span>
            <b>Weather</b>
          </button>
        </div>
      </aside>
    </section>

    <section class="cc-grid">
      <aside class="side-box" aria-label="Notifications">
        <h2>NOTIFICATIONS</h2>
        <ul class="side-list" data-notifs="side" aria-live="polite"></ul>
        <button type="button" class="side-more" data-go="alerts">VIEW ALL NOTIFICATIONS <span>›</span></button>
      </aside>

      <section class="side-box" data-go="weather" role="button" tabindex="0" aria-label="Weather details">
        <h2>SAN ANTONIO, TX</h2>
        <div class="side-wx-now"><span data-wx="icon">☀️</span><div><b data-wx="temp">--°F</b><span data-wx="cond">Loading</span><i data-wx="hl"></i></div></div>
        <div class="side-fc" data-wx="forecast"></div>
      </section>
    </section>

    <section class="cc-quick-wrap" aria-label="Quick actions">
      <p class="proj-head">QUICK ACTIONS</p>
      <nav class="cc-quick">
        <button type="button" class="cc-chip" data-go="dispatch">Dispatch</button>
        <button type="button" class="cc-chip" data-go="jobs">Jobs</button>
        <button type="button" class="cc-chip" data-go="technicians">Technicians</button>
        <button type="button" class="cc-chip" data-go="customers">Customers</button>
        <button type="button" class="cc-chip" data-go="decisions">Approvals</button>
        <button type="button" class="cc-chip" data-go="gibam">Projects</button>
        <button type="button" class="cc-chip" data-go="status">System status</button>
        <button type="button" class="cc-chip" data-go="settings">Settings</button>
      </nav>
    </section>

    <section class="cc-apps-wrap" aria-label="Apps">
      <div class="dock-title"><img src="cc/dice.webp" alt=""><span>MY APPS</span></div>
      <div class="cc-apps-grid" data-apps="dock"></div>
    </section>
  </main>

  <!-- Drawer -->
  <div id="backdrop" class="panel-bg" hidden></div>
  <aside id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" hidden>
    <header>
      <button id="panelClose" type="button" aria-label="Close">×</button>
      <h1 id="panelTitle">Command Center</h1>
    </header>
    <div id="panelBody" class="panel-body"></div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="cc/apps.js"></script>
  <script src="cc/hq.js"></script>
  <script src="cc/cc.js"></script>
  <script src="cc/watch.js"></script>
  <script src="cc/hq-embed.js"></script>
  <script src="cc/talk.js"></script>
</body>
</html>
