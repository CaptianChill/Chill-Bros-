<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lead Engine</title>
<style>
:root{--bg:#0b0f14;--card:#121922;--line:#223040;--tx:#e8eef5;--mut:#8aa0b5;--a:#34d399;--b:#60a5fa;--c:#fbbf24;--d:#f87171}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:20px 18px 8px}h1{margin:0;font-size:22px;letter-spacing:.5px}header p{margin:4px 0 0;color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 18px;align-items:center}
select,input,button{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}
button{background:#1d4ed8;border-color:#1d4ed8;font-weight:600;cursor:pointer}button.ghost{background:transparent}
#status{color:var(--mut);padding:0 18px}
.list{padding:8px 18px 40px;display:grid;gap:10px}
.lead{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.top{display:flex;gap:10px;align-items:center}.rk{color:var(--mut);width:28px}
.sc{font-weight:800;border-radius:9px;padding:3px 8px;min-width:52px;text-align:center;color:#06110b}
.g-A{background:var(--a)}.g-B{background:var(--b)}.g-C{background:var(--c)}.g-D{background:var(--d)}
.nm{font-weight:700;font-size:16px}.ty{color:var(--mut);font-size:13px}
.pitch{margin:8px 0 4px}.why{color:var(--mut);font-size:13px}
.ct{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;font-size:14px}.ct a{color:#93c5fd}
.f{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.f span{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mut)}
</style></head><body>
<header><h1>LEAD ENGINE</h1><p>Ranked, industry-specific prospects for San Antonio. Every lead is scored on the variables that matter for that offer.</p></header>
<div class="bar">
<select id="p"><option value="auto_web">Auto shops → website build</option><option value="chill_commercial">Chill Pros → coolers, freezers, ice, cooking</option></select>
<input id="n" type="number" value="60" min="10" max="300" style="width:90px" title="How many">
<label style="color:var(--mut)"><input id="ch" type="checkbox"> include chains</label>
<button id="go">Run scan</button><button class="ghost" id="csv">Download CSV</button></div>
<div id="status">Pick an industry and run a scan (takes about a minute).</div><div class="list" id="out"></div>
<script>
const $=s=>document.querySelector(s);const key=new URLSearchParams(location.search).get('key')||'';
const q=()=>`/api/scan?profile=${$('#p').value}&limit=${$('#n').value}&chains=${$('#ch').checked?1:0}${key?`&key=${encodeURIComponent(key)}`:''}`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#csv').onclick=()=>location.href=q()+'&format=csv';
$('#go').onclick=async()=>{$('#status').textContent='Scanning the map and auditing websites…';$('#out').innerHTML='';
 try{const r=await fetch(q());const j=await r.json();if(!r.ok)throw new Error(j.error);
 $('#status').textContent=`${j.leads.length} ranked of ${j.eligible} eligible (${j.unique} businesses found, ${j.audited} websites audited). ${j.profile.offer}.`;
 $('#out').innerHTML=j.leads.map(l=>`<div class="lead"><div class="top"><span class="rk">#${l.rank}</span><span class="sc g-${l.grade}">${l.score} ${l.grade}</span><div><div class="nm">${esc(l.name)}</div><div class="ty">${esc(l.type)}${l.km_from_base!=null?` · ${l.km_from_base} km`:''}${l.chain?' · chain':''}</div></div></div>
 <div class="pitch">${esc(l.pitch)}</div><div class="why">${esc(l.why)}</div>
 <div class="ct">${l.phone?`<a href="tel:${esc(l.phone)}">${esc(l.phone)}</a>`:''}${l.email?`<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>`:''}${l.website?`<a target=_blank href="${esc(l.website)}">website</a>`:''}${l.address?`<span>${esc(l.address)}</span>`:''}<a target=_blank href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l.name+' '+(l.address||'San Antonio TX'))}">Google Maps</a></div>
 <div class="f">${Object.entries(l.factors).map(([k,v])=>`<span>${k} ${v}</span>`).join('')}</div></div>`).join('');
 }catch(e){$('#status').textContent='Scan failed: '+e.message}};
</script></body></html>
