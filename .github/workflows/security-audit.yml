name: Security audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: TEMP apply audit fixes to lockfile
        if: github.event_name == 'pull_request'
        run: |
          npm audit fix --omit=dev --package-lock-only --ignore-scripts || true
          git status --short
          if ! git diff --quiet -- package-lock.json package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json package.json
            git commit -m "Apply npm audit fix to production dependencies"
            git push origin HEAD:${{ github.head_ref }}
            echo "::notice::Committed npm audit fix lockfile changes"
          else
            echo "::notice::npm audit fix made no changes"
          fi

      - name: Audit production dependencies
        run: |
          # List each high/critical finding as an annotation so failures are readable without the raw log.
          npm audit --omit=dev --json > audit.json || true
          node -e '
            const r = JSON.parse(require("fs").readFileSync("audit.json", "utf8"));
            for (const [name, v] of Object.entries(r.vulnerabilities || {})) {
              if (!["high", "critical"].includes(v.severity)) continue;
              const fix = v.fixAvailable === true ? "fix available" : v.fixAvailable ? `fix: ${v.fixAvailable.name}@${v.fixAvailable.version}${v.fixAvailable.isSemVerMajor ? " (major)" : ""}` : "no fix available";
              const via = (v.via || []).map((x) => typeof x === "string" ? x : x.title).join("; ");
              console.log(`::error title=npm audit ${v.severity}::${name} ${v.range} | ${fix} | ${via}`);
            }
          '
          npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Field Notes workflow tests
        run: node --test scripts/field-notes.test.cjs scripts/parts-research.test.cjs

      - name: Production build
        run: npm run build
        env:
          # Build-only placeholder so module evaluation for /auth/callback
          # doesn't throw; this never deploys anything and carries no
          # real credential. Vercel's actual deployments already have
          # NEON_AUTH_COOKIE_SECRET configured separately.
          NEON_AUTH_COOKIE_SECRET: ci-build-placeholder-not-a-real-secret
