name: Security audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Field Notes workflow tests
        run: node --test scripts/field-notes.test.cjs

      - name: Production build
        run: npm run build
        env:
          # Build-only placeholder so module evaluation for /auth/callback
          # doesn't throw; this never deploys anything and carries no
          # real credential. Vercel's actual deployments already have
          # NEON_AUTH_COOKIE_SECRET configured separately.
          NEON_AUTH_COOKIE_SECRET: ci-build-placeholder-not-a-real-secret
