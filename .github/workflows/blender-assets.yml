name: Build Blender Assets

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/blender/**"
      - "public/logo.png"
      - ".github/workflows/blender-assets.yml"

permissions:
  contents: write

concurrency:
  group: blender-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-blender-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: Generate Chill Bros 3D assets
        run: blender --background --python scripts/blender/build_assets.py

      - name: Verify exports
        run: |
          test -s public/3d/brand/chill-bros-neon-logo.glb
          test -s public/3d/equipment/hvac/rtu-training-shell.glb
          test -s public/3d/equipment/refrigeration/reach-in-training.glb
          test -s public/3d/equipment/ice/ice-machine-training.glb
          test -s public/3d/equipment/cooking/commercial-fryer-training.glb
          test -s public/3d/vehicles/chill-bros-service-vehicle.glb
          grep -q '"rtu-training-shell"' lib/chillbros/three-d-generated.ts

      - name: Keep editable Blender source files as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chill-bros-blender-source-${{ github.sha }}
          path: blender/build-output/*.blend
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated GLB assets and build manifest
        shell: bash
        run: |
          git config user.name "chill-bros-blender-bot"
          git config user.email "chill-bros-blender-bot@users.noreply.github.com"
          git add public/3d lib/chillbros/three-d-generated.ts
          if git diff --cached --quiet; then
            echo "Blender assets already match the current source."
            exit 0
          fi
          git commit -m "Build Chill Bros Blender assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
