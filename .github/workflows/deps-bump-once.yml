name: One-time dependency security bump

on:
  push:
    branches: [deps/next-security]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Bump Next.js to latest 16.x and apply non-breaking audit fixes
        run: |
          V=$(npm view 'next@^16.4.3' version --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const v=JSON.parse(d);console.log(Array.isArray(v)?v[v.length-1]:v)})')
          echo "Next.js -> $V"
          npm install --ignore-scripts --save-exact "next@$V" "eslint-config-next@$V"
          npm audit fix --omit=dev --ignore-scripts || true
          echo "----- remaining production audit findings -----"
          npm audit --omit=dev || true
      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Bump Next.js to latest 16.x and apply non-breaking npm audit fixes" || echo "nothing to commit"
          git push origin HEAD:deps/next-security
